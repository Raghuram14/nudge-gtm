pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs}"
      run: pnpm exec eslint {staged_files}
    types:
      run: pnpm typecheck
    format:
      glob: "*.{js,jsx,ts,tsx,mjs,css,md,json,yml}"
      run: pnpm exec prettier --check {staged_files}

pre-push:
  commands:
    test:
      run: pnpm test
